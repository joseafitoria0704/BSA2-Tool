# =============================================================================
# Configuración del análisis de calidad de código (SonarQube)
# -----------------------------------------------------------------------------
# Este archivo NO es documentación ni forma parte de la herramienta BSA 2.0.
# Lo lee el escáner de SonarQube que ejecuta el workflow
# .github/workflows/build.yml para evaluar la calidad del código (bugs,
# vulnerabilidades, duplicación, deuda técnica), requisito de la iniciativa
# Código para el Desarrollo del BID para publicar herramientas.
#
# Debe permanecer en la raíz del repositorio: es la ubicación donde el escáner
# lo busca por defecto y la que usan las plantillas del BID (EL-BID).
#
# This file configures the SonarQube code-quality scan required by the IDB
# (Code for Development). It is not documentation and must stay at the
# repository root.
# =============================================================================

sonar.projectKey=EL-BID_BSA2-Tool
sonar.projectName=BSA2-Tool

# Source code
sonar.sources=.
sonar.python.version=3.11

# Common exclusions + material no analizable (documentación, ejemplos, binarios de ArcGIS)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/*.min.js,**/vendor/**,**/__pycache__/**,**/*.pyc,**/venv/**,**/.venv/**,**/coverage/**,site/**,docs/assets/**,ejemplos/**,**/*.gdb/**,**/*.aprx,**/*.atbx,**/*.zip,**/*.pdf,**/*.xlsx

# SCM
sonar.scm.provider=git
